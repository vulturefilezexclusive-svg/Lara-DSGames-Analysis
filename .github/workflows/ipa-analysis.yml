name: Targeted dylib symbol reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ipa-analysis.yml"
      - "lara_v0.2.ipa"
      - "DSGames_2.5.ipa"

permissions:
  contents: write

concurrency:
  group: targeted-dylib-symbol-reports
  cancel-in-progress: false

jobs:
  symbols:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and extract IPA inputs
        shell: bash
        run: |
          set -euo pipefail
          for ipa in lara_v0.2.ipa DSGames_2.5.ipa; do
            test -s "$ipa" || { echo "::error::Missing or empty $ipa"; exit 1; }
          done
          rm -rf work
          mkdir -p work
          ditto -x -k lara_v0.2.ipa work/lara
          ditto -x -k DSGames_2.5.ipa work/dsgames

      - name: Generate four targeted symbol reports
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          targets = [
              ("Lara-v0.2", Path("work/lara"), "libgrabkernel2.dylib"),
              ("Lara-v0.2", Path("work/lara"), "libxpf.dylib"),
              ("DSGames-2.5", Path("work/dsgames"), "libgrabkernel2.dylib"),
              ("DSGames-2.5", Path("work/dsgames"), "libxpf.dylib"),
          ]
          out = Path("reports/symbols")
          out.mkdir(parents=True, exist_ok=True)

          def run(args):
              p = subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                 stderr=subprocess.STDOUT)
              return p.returncode, p.stdout

          for app_name, root, dylib_name in targets:
              matches = list(root.rglob(dylib_name))
              report = [
                  f"# Symbol report: {app_name} / {dylib_name}",
                  "",
                  "Static Mach-O symbol inspection only; this does not establish runtime behavior.",
                  "",
              ]
              if len(matches) != 1:
                  report += [f"ERROR: expected exactly one {dylib_name}; found {len(matches)}",
                             "Matches:"] + [str(p) for p in matches]
              else:
                  binary = matches[0]
                  data = binary.read_bytes()
                  report += [
                      f"Path in extracted IPA: {binary}",
                      f"File size: {len(data)} bytes",
                      f"SHA-256: {hashlib.sha256(data).hexdigest()}",
                      "",
                  ]
                  rc, archs = run(["xcrun", "lipo", "-archs", str(binary)])
                  report += ["## Architectures", f"Exit code: {rc}", archs.rstrip(), ""]
                  architectures = archs.strip().split() if rc == 0 else []
                  for arch in architectures:
                      report += [f"## {arch}: defined global external symbols",
                                 f"Command: xcrun nm -arch {arch} -gU <binary>"]
                      rc, output = run(["xcrun", "nm", "-arch", arch, "-gU", str(binary)])
                      report += [f"Exit code: {rc}", output.rstrip() or "(no output)", "",
                                 f"## {arch}: undefined symbols",
                                 f"Command: xcrun nm -arch {arch} -u <binary>"]
                      rc, output = run(["xcrun", "nm", "-arch", arch, "-u", str(binary)])
                      report += [f"Exit code: {rc}", output.rstrip() or "(no output)", ""]
              filename = f"{app_name}-{dylib_name.replace('.', '-')}-symbols.txt"
              (out / filename).write_text("\n".join(report) + "\n", encoding="utf-8")

          index = [
              "# Four targeted dylib symbol reports",
              "",
              "Generated from the checked-in IPA files by GitHub Actions.",
              "",
              "- Lara-v0.2-libgrabkernel2-dylib-symbols.txt",
              "- Lara-v0.2-libxpf-dylib-symbols.txt",
              "- DSGames-2.5-libgrabkernel2-dylib-symbols.txt",
              "- DSGames-2.5-libxpf-dylib-symbols.txt",
              "",
              "Each report includes SHA-256, architecture slices, defined global symbols, and undefined symbols.",
              "These are static results and do not prove runtime capability or cross-process access.",
          ]
          (out / "README.md").write_text("\n".join(index) + "\n", encoding="utf-8")
          PY

      - name: Commit symbol reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/symbols/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add four targeted dylib symbol reports"
            git push
          fi
